<title>Habit Pix</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap">
<style>
/* Layout: one phone-width column, sticky header on top, date strip + tab bar pinned at the bottom.
   Single deliberate dark look (pixel/arcade screen), every color explicit. */
:root{
  --bg:#0a0a0c;
  --surface:#131317;
  --raise:#1d1d23;
  --line:#2b2b33;
  --fg:#f3f1ea;
  --muted:#8d8b97;
  --white:#f3f1ea;
  --ink:#0a0a0c;
  --warn:#ff8a3d;
  --good:#7bd88f;
  --font-pixel:"Silkscreen","Courier New",monospace;
  --font-text:"VT323","Courier New",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font-family:var(--font-text);font-size:20px;line-height:1.15;-webkit-font-smoothing:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.5}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.app{max-width:460px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
.pad{padding-inline:16px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--surface)}
.logo{width:40px;height:40px;flex:none;image-rendering:pixelated}
.brand{font-family:var(--font-pixel);font-weight:700;font-size:22px;letter-spacing:.08em;flex:1;min-width:0;white-space:nowrap}
.brand b:nth-of-type(1){color:#ffd23f}.brand b:nth-of-type(2){color:#ff5a7a}.brand b:nth-of-type(3){color:#4fc3f7}
.btn-sq{width:46px;height:46px;flex:none;border:0;border-radius:10px;background:var(--white);color:var(--ink);display:grid;place-items:center}
.btn-sq.ghost{background:var(--surface);color:var(--fg);border:2px solid var(--line)}
.btn-sq.ghost[aria-pressed="true"]{background:var(--white);color:var(--ink)}
.btn-sq svg{width:22px;height:22px}

/* filters */
.filters{display:flex;gap:8px;overflow-x:auto;padding-block:12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-family:var(--font-pixel);font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.chip.icon{width:44px;padding:0;justify-content:center}
.chip svg{width:18px;height:18px}
.chip[aria-pressed="true"]{background:var(--white);color:var(--ink);border-color:var(--white)}
.search{display:flex;padding-bottom:10px}
.search input{width:100%;height:44px;border-radius:10px;border:2px solid var(--line);background:var(--surface);padding:0 12px;font-size:22px}

/* companion */
.pet{display:flex;gap:14px;align-items:center;padding:12px 14px;border:2px dashed var(--line);border-radius:14px}
.pet canvas{width:60px;height:50px;image-rendering:pixelated;flex:none}
@media (prefers-reduced-motion:no-preference){.pet canvas{animation:bob 1.2s steps(2) infinite}}
@keyframes bob{50%{transform:translateY(-3px)}}
.pet-body{flex:1;min-width:0}
.pet-name{font-family:var(--font-pixel);font-size:13px;letter-spacing:.1em;display:flex;justify-content:space-between;gap:8px}
.xp{height:10px;background:var(--raise);margin-block:6px;display:flex}
.xp i{display:block;height:100%;background:#ff9f1c}
.pet-msg{color:var(--muted);font-size:18px}

/* habit card */
main{flex:1;padding-bottom:20px}
.view{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.c-head{display:flex;align-items:center;gap:12px}
.tile{width:56px;height:52px;flex:none;border-radius:10px;border:0;padding:0;background:var(--cl);display:grid;place-items:center}
.tile svg{width:30px;height:30px;color:var(--ci)}
.c-txt{flex:1;min-width:0}
.c-title{font-family:var(--font-pixel);font-weight:700;font-size:18px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-desc{font-family:var(--font-pixel);font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.check{width:62px;height:50px;flex:none;border-radius:10px;border:0;background:var(--white);color:var(--ink);display:grid;place-items:center;font-family:var(--font-pixel);font-size:12px;font-weight:700;padding:0 4px;line-height:1.1}
.check svg{width:26px;height:26px}
.check.done{background:var(--cd);color:var(--white)}
.check.half{background:linear-gradient(135deg,var(--cd) 50%,var(--white) 50%)}
.bar{background:var(--cl);color:var(--ci);border-radius:8px;min-height:34px;padding:4px 10px;display:flex;align-items:center;gap:8px;font-family:var(--font-pixel);font-size:12px;letter-spacing:.06em}
.bar svg{width:16px;height:16px;flex:none}
.bar .streak{display:flex;align-items:center;gap:5px;font-size:15px;font-weight:700}
.bar .sp{flex:1}
.bar .sep{opacity:.5}
.bar .tail{display:flex;align-items:center;gap:8px}
.mini-btn{border:2px solid var(--ci);background:transparent;color:var(--ci);border-radius:6px;font-family:var(--font-pixel);font-size:10px;letter-spacing:.06em;padding:2px 6px;height:24px;flex:none}
.mini-btn.on{background:var(--ci);color:var(--cl)}
.trig{font-size:19px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.trig em{font-style:normal;color:var(--fg)}
.alert{font-family:var(--font-pixel);font-size:11px;letter-spacing:.06em;color:var(--warn);border:2px solid var(--warn);border-radius:8px;padding:6px 8px;text-transform:uppercase}

.heat-wrap{display:grid;grid-template-columns:16px minmax(0,1fr);column-gap:6px;row-gap:4px}
.days{display:grid;grid-template-rows:repeat(7,1fr);gap:3px;font-family:var(--font-pixel);font-size:10px;color:var(--muted);border-right:2px solid var(--line);padding-right:4px}
.days span{display:flex;align-items:center}
.heat{display:grid;grid-template-rows:repeat(7,auto);grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px;min-width:0}
.cell{aspect-ratio:1;border-radius:2px;background:var(--cl);border:0;padding:0;width:100%;min-width:0}
.cell.v1{background:var(--cd)}
.cell.v5{background:linear-gradient(135deg,var(--cd) 50%,var(--cl) 50%)}
.cell.fut{opacity:.25}
.cell.today{outline:2px solid var(--fg);outline-offset:1px}
.cell.sel:not(.today){outline:2px dashed var(--fg);outline-offset:1px}
.months{grid-column:2;display:grid;grid-auto-columns:1fr;gap:3px;font-family:var(--font-pixel);font-size:10px;color:var(--muted);height:14px}
.months span{white-space:nowrap}

/* generic rows & panels */
.h2{font-family:var(--font-pixel);font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.h2.fg{color:var(--fg)}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.row .tile{width:44px;height:42px}
.row .tile svg{width:24px;height:24px}
.row-txt{flex:1;min-width:0}
.row-t{font-family:var(--font-pixel);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.row-s{font-size:18px;color:var(--muted)}
.row .check{width:52px;height:42px}
.empty{color:var(--muted);text-align:center;padding:20px 8px;border:2px dashed var(--line);border-radius:14px}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.note{font-size:18px;color:var(--muted);margin:0}
.note.ok{color:var(--good)}.note.bad{color:var(--warn)}

/* forms */
.q{font-family:var(--font-pixel);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.in{height:42px;border-radius:8px;border:2px solid var(--line);background:var(--raise);padding:0 8px;font-size:21px;width:100%;min-width:0}
textarea.in{height:auto;min-height:84px;padding:8px;resize:vertical}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.btn{height:46px;border-radius:10px;border:2px solid var(--line);background:var(--raise);font-family:var(--font-pixel);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--white);color:var(--ink);border-color:var(--white)}
.btn.small{height:34px;font-size:10px;padding:0 8px}
.btn.danger{border-color:var(--warn);color:var(--warn)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;height:38px;border-radius:8px;border:2px solid var(--line);background:var(--raise);font-family:var(--font-pixel);font-size:10px;letter-spacing:.04em;text-transform:uppercase;padding:0 6px}
.seg button[aria-pressed="true"]{background:var(--white);color:var(--ink);border-color:var(--white)}
.icon-btn{width:34px;height:34px;flex:none;border-radius:8px;border:2px solid var(--line);background:var(--raise);display:grid;place-items:center;padding:0}
.icon-btn svg{width:14px;height:14px}
.ai-badge{font-family:var(--font-pixel);font-size:10px;letter-spacing:.06em;padding:4px 8px;border-radius:6px;border:2px solid var(--line);color:var(--muted);text-transform:uppercase;white-space:nowrap}
.ai-badge.on{border-color:var(--good);color:var(--good)}

/* analyses */
.chart{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:130px;border-bottom:2px solid var(--line);padding-top:16px;position:relative}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;position:relative;z-index:1}
.col i{display:block;width:100%;background:var(--bc,#ffd23f);min-height:2px}
.col b{font-family:var(--font-pixel);font-size:9px;font-weight:400;color:var(--fg);white-space:nowrap}
.goal-line{position:absolute;left:0;right:0;border-top:2px dashed var(--fg);opacity:.5;z-index:0}
.col-lbl{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;text-align:center;font-family:var(--font-pixel);font-size:10px;color:var(--muted)}
.stat{display:grid;grid-template-columns:1fr auto auto auto;gap:4px 14px;align-items:center;font-variant-numeric:tabular-nums}
.stat .hd{font-family:var(--font-pixel);font-size:10px;color:var(--muted);letter-spacing:.08em}
.stat .nm{font-family:var(--font-pixel);font-size:12px;text-transform:uppercase;display:flex;gap:8px;align-items:center;min-width:0}
.stat .nm i{width:12px;height:12px;flex:none;background:var(--cd)}
.stat .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat .n{text-align:right;font-size:22px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--raise);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-size:30px;font-weight:400;font-variant-numeric:tabular-nums}
.kpi span{font-family:var(--font-pixel);font-size:9px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}

/* sport */
.cal-head{display:flex;align-items:center;gap:8px}
.cal-head .h2{flex:1;text-align:center;color:var(--fg)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-family:var(--font-pixel);font-size:10px;color:var(--muted);text-align:center;padding-bottom:2px}
.cd{aspect-ratio:1;border-radius:6px;border:2px solid var(--line);background:var(--raise);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;font-variant-numeric:tabular-nums}
.cd span{font-size:17px;line-height:1}
.cd small{font-family:var(--font-pixel);font-size:9px;line-height:1}
.cd.out{opacity:.3}
.cd.plan{border-color:#e2ad12;color:#f8e3a3}
.cd.done{background:#e2ad12;border-color:#e2ad12;color:var(--ink)}
.cd.miss{border-color:var(--warn);border-style:dashed}
.cd.today{outline:2px solid var(--fg);outline-offset:1px}
.cd.pick{background:var(--white);color:var(--ink);border-color:var(--white)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-family:var(--font-pixel);font-size:9px;color:var(--muted);text-transform:uppercase}
.legend i{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:-1px;border:2px solid #e2ad12}
.legend i.f{background:#e2ad12}.legend i.m{border-color:var(--warn);border-style:dashed}
.ex{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:2px solid var(--raise)}
.ex:first-of-type{border-top:0}
.ex-tick{width:34px;height:34px;flex:none;border-radius:8px;border:2px solid #e2ad12;background:transparent;display:grid;place-items:center;padding:0;color:var(--ink)}
.ex-tick svg{width:18px;height:18px}
.ex-tick.on{background:#e2ad12}
.ex-main{flex:1;min-width:0}
.ex-n{font-family:var(--font-pixel);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.ex-d{font-size:18px;color:var(--muted)}
.ex-kg{width:74px;flex:none}
.ex-kg .in{height:36px;font-size:19px;text-align:right}
.pday{border:2px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.pday-head{display:flex;gap:8px;align-items:center}
.pday-sum{display:flex;gap:8px;align-items:center;cursor:pointer;list-style:none}
.pday-sum::-webkit-details-marker{display:none}
.pday[open] .pday-sum{padding-bottom:4px}
.pday-sum .letter{width:34px;height:34px;flex:none;border-radius:8px;background:#e2ad12;color:var(--ink);display:grid;place-items:center;font-family:var(--font-pixel);font-weight:700}
.exrow{display:grid;grid-template-columns:repeat(3,1fr) 34px;gap:6px;padding-top:8px;border-top:2px solid var(--raise)}
.exrow .name{grid-column:1/4}
.exrow .f .in{height:36px;font-size:19px}
.tips{margin:0;padding-left:18px;color:var(--muted);font-size:18px;display:flex;flex-direction:column;gap:4px}

/* nutrition */
.macro{display:flex;flex-direction:column;gap:4px}
.macro-top{display:flex;justify-content:space-between;font-family:var(--font-pixel);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.macro-top b{font-family:var(--font-text);font-size:22px;font-weight:400;color:var(--fg)}
.meter{height:14px;background:var(--raise);display:flex}
.meter i{display:block;height:100%;background:var(--mc)}
.meter.over i{background:repeating-linear-gradient(90deg,var(--mc) 0 6px,var(--warn) 6px 8px)}
.food{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:2px solid var(--raise)}
.food-main{flex:1;min-width:0}
.food-n{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.food-d{font-size:16px;color:var(--muted);font-variant-numeric:tabular-nums}
.food-k{font-variant-numeric:tabular-nums;font-size:20px;text-align:right;flex:none}
.meal-h{display:flex;justify-content:space-between;font-family:var(--font-pixel);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:6px}

/* journal */
.moods{display:flex;gap:8px}
.mood{flex:1;height:44px;border-radius:8px;border:2px solid var(--line);background:var(--raise);font-family:var(--font-pixel);font-size:12px}
.mood[aria-pressed="true"]{background:var(--white);color:var(--ink)}
.method h3{font-family:var(--font-pixel);font-size:15px;letter-spacing:.08em;text-transform:uppercase;margin:0}
.method p{margin:0;font-size:20px;max-width:60ch}
.method .ex2{color:var(--muted)}
.tag{align-self:flex-start;font-family:var(--font-pixel);font-size:10px;letter-spacing:.06em;text-transform:uppercase;background:var(--cl);color:var(--ci);padding:4px 8px;border-radius:6px}

/* bottom */
.bottom{position:sticky;bottom:0;z-index:5;background:var(--bg);border-top:2px solid var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
.dates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding-block:10px}
.date{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:10px;background:var(--surface);padding:6px;min-width:0}
.date .num{width:34px;height:34px;flex:none;border-radius:6px;background:var(--raise);display:grid;place-items:center;font-family:var(--font-pixel);font-size:14px}
.date[aria-pressed="true"] .num{background:var(--white);color:var(--ink)}
.date .dd{font-family:var(--font-pixel);font-size:11px;line-height:1.3;text-align:left;text-transform:uppercase;min-width:0}
.date .dd small{display:block;color:var(--muted);font-size:9px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);padding-block:8px 10px}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--font-pixel);font-size:10px;color:var(--muted);text-transform:uppercase;padding:4px 0}
.tab svg{width:28px;height:28px}
.tab[aria-selected="true"]{color:var(--fg)}

/* sheet */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:460px;max-height:92vh;max-height:92dvh;overflow-y:auto;background:var(--surface);border-top:2px solid var(--line);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet-h{display:flex;align-items:center;gap:10px}
.sheet-h h2{flex:1;font-family:var(--font-pixel);font-size:17px;letter-spacing:.08em;margin:0;text-transform:uppercase}
.swatches,.icons{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:8px;border:2px solid transparent}
.sw[aria-pressed="true"]{border-color:var(--fg)}
.ic{width:42px;height:42px;border-radius:8px;border:2px solid var(--line);background:var(--raise);display:grid;place-items:center}
.ic svg{width:20px;height:20px}
.ic[aria-pressed="true"]{background:var(--white);color:var(--ink)}
.cat-row{display:flex;align-items:center;gap:10px;padding:6px 0}
.cat-row .tile{width:40px;height:38px}
.cat-row .tile svg{width:22px;height:22px}
.toast{position:fixed;left:50%;bottom:170px;transform:translateX(-50%);z-index:30;background:var(--white);color:var(--ink);font-family:var(--font-pixel);font-size:12px;letter-spacing:.06em;padding:10px 14px;border-radius:10px;max-width:calc(100% - 32px);text-align:center}
.page-h{display:flex;align-items:flex-start;gap:10px;padding-top:12px}
.page-h>div{flex:1;min-width:0}
.page-h h1{font-family:var(--font-pixel);font-size:20px;letter-spacing:.1em;text-transform:uppercase;margin:0}
.page-h p{margin:4px 0 0;color:var(--muted);font-size:19px}
.page-h .icon-btn{width:42px;height:42px}
.datebar{display:flex;align-items:center;gap:8px}
.datebar .lbl{flex:1;min-width:0;text-align:center;font-family:var(--font-pixel);font-size:12px;letter-spacing:.06em;text-transform:uppercase;border:2px solid var(--line);border-radius:10px;height:44px;display:grid;place-items:center;background:var(--surface);padding:0 6px}
.datebar .icon-btn{width:44px;height:44px}
.datebar .icon-btn svg{width:16px;height:16px}
.datebar .btn{height:44px}
.quote{display:flex;gap:12px;align-items:center;background:var(--surface);border:2px solid var(--line);border-left:6px solid #ffd23f;border-radius:12px;padding:10px 12px}
.quote p{flex:1;margin:0;font-size:21px}
.quote small{display:block;font-family:var(--font-pixel);font-size:9px;letter-spacing:.1em;color:#ffd23f;margin-bottom:4px}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu-tile{display:flex;flex-direction:column;gap:8px;align-items:flex-start;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.menu-tile .tile{width:44px;height:42px}
.menu-tile .tile svg{width:24px;height:24px}
.menu-tile b{font-family:var(--font-pixel);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.menu-tile span{color:var(--muted);font-size:17px}
.mini-btn svg{width:12px;height:12px}
.note-btn{display:grid;place-items:center;width:30px;padding:0}
.big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.big b{font-size:54px;font-weight:400;line-height:.9;font-variant-numeric:tabular-nums;color:var(--tc,#ffd23f)}
.big b span{font:inherit;color:inherit;letter-spacing:0;text-transform:none}
.big>span{font-family:var(--font-pixel);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dots{display:grid;gap:4px}
.dots i{aspect-ratio:1;border-radius:3px;background:var(--raise);display:block}
.dots i.left{background:var(--tc,#ffd23f)}
.dots i.now{background:var(--fg);outline:2px solid var(--fg)}
.life{width:100%;max-width:364px;image-rendering:pixelated;display:block;margin:0 auto}
.subkpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.jact{border:2px solid var(--line);border-radius:12px;padding:8px 10px}
.jact summary{display:flex;align-items:center;gap:10px;cursor:pointer;list-style:none}
.jact summary::-webkit-details-marker{display:none}
.jact .tile{width:40px;height:38px}
.jact .tile svg{width:22px;height:22px}
.jact[open] summary{padding-bottom:8px}
.jact-body{display:flex;flex-direction:column;gap:8px}
.hist{display:flex;flex-direction:column;gap:8px}
.hist div{border-top:2px solid var(--raise);padding-top:6px}
.hist b{font-family:var(--font-pixel);font-size:10px;letter-spacing:.06em;color:var(--muted);font-weight:400;text-transform:uppercase}
.help{display:flex;gap:12px;align-items:flex-start}
.help .k{flex:none;min-width:56px;height:36px;border-radius:8px;background:var(--white);color:var(--ink);display:grid;place-items:center;font-family:var(--font-pixel);font-size:10px;padding:0 6px}
.help .k svg{width:18px;height:18px}
.help p{margin:0;font-size:19px}
@media (max-width:380px){
  .tab{font-size:8px}.tab svg{width:24px;height:24px}
  .grid3,.grid4{grid-template-columns:1fr 1fr}
  .c-title{font-size:15px}
  .tile{width:48px;height:46px}
  .check{width:54px}
  .big b{font-size:44px}
  .bar{gap:6px;padding:4px 8px}
  .bar .tail{display:none}
  .seg button{font-size:9px}
}
@media (max-width:345px){.brand .hb{display:none}.menu-grid{grid-template-columns:1fr}}

const UP=["push","pull","shoulders","pull","arms","push","core"],LO=["legs","hinge","legs","hinge","core","legs","core"];

function localProgram(p){
  const n=+p.days,pool=POOL[p.equip]||POOL.salle,count=+p.minutes<=30?4:+p.minutes<=45?5:+p.minutes<=60?6:7;
  let split;
  if(n<=3) split=FB.slice(0,n).map((pat,i)=>["Full body",pat,i]);
  else if(n===4) split=[["Haut du corps",UP,0],["Bas du corps",LO,0],["Haut du corps",UP,1],["Bas du corps",LO,1]];
  else{const ppl=[["Push · pecs, épaules, triceps",PU,0],["Pull · dos, biceps",PL,0],["Jambes",LO,0]];
    split=n===5?[...ppl,["Haut du corps",UP,1],["Bas du corps",LO,1]]:[...ppl,...ppl.map(([a,b])=>[a,b,1])];}
  const scheme=(i)=>{
    const lv=p.level==="debut"?0:p.level==="avance"?1:0.5;
    if(p.goal==="force") return i<2?{sets:5,reps:"4-6",rest:"3 min"}:{sets:3,reps:"8-10",rest:"90 s"};
    if(p.goal==="perte") return {sets:3,reps:"12-15",rest:"45 s"};
    if(p.goal==="endurance") return {sets:3,reps:"15-20",rest:"30 s"};
    if(p.goal==="forme") return {sets:lv?3:2,reps:"10-12",rest:"60 s"};
    return {sets:lv>=.5&&i<3?4:3,reps:i<2?"6-10":"10-12",rest:i<2?"2 min":"90 s"};
  };
  const days=split.map(([name,pat,variant],di)=>{
    const used={};
    const ex=pat.slice(0,count).map((key,i)=>{
      const k=(used[key]=(used[key]??-1)+1),list=pool[key];
      const nm=list[(k+variant+(n<=3?di:0))%list.length];
      return {n:nm,...scheme(i),kg:0,note:key==="core"?"Gainage : en secondes":""};
    });
    return {name:`Jour ${String.fromCharCode(65+di)} · ${name}`,ex};
  });
  return {name:`${GOALS[p.goal]} · ${n} j/sem`,schedule:SCHED[n]||SCHED[3],days,
    tips:[p.goal==="perte"?"Enchaîne les exercices en circuit, repos court.":"Ajoute 1 répétition ou 2,5 kg dès que tu fais le haut de la fourchette.",
      "Charge : garde 2 à 3 répétitions en réserve (RPE 7-8).","Échauffe-toi 5 à 10 minutes avant chaque séance."],source:"local"};
}
function cleanProgram(o,fallback){
  if(!o||!Array.isArray(o.days)||!o.days.length) throw new Error("bad");
  const days=o.days.slice(0,7).map((d,i)=>({name:String(d.name||`Jour ${String.fromCharCode(65+i)}`).slice(0,60),
    ex:(Array.isArray(d.ex)?d.ex:[]).slice(0,12).map(e=>({n:String(e.n||e.name||"Exercice").slice(0,60),sets:Math.max(1,Math.min(10,r0(e.sets)||3)),
      reps:String(e.reps??"10").slice(0,12),kg:+e.kg||0,rest:String(e.rest||"").slice(0,12),note:String(e.note||"").slice(0,120)}))}));
  let sched=(Array.isArray(o.schedule)?o.schedule:[]).map(Number).filter(n=>n>=0&&n<=6);
  if(!sched.length) sched=SCHED[Math.min(6,Math.max(2,days.length))]||fallback;
  return {name:String(o.name||"Mon programme").slice(0,60),schedule:[...new Set(sched)].sort(),days,tips:(Array.isArray(o.tips)?o.tips:[]).slice(0,5).map(String),source:"ia"};
}

function planWeeks(W,weeks,from){

function totals(k){
  const L=S.food.log[k]||[];
  return L.reduce((a,e)=>({kcal:a.kcal+(+e.kcal||0),p:a.p+(+e.p||0),c:a.c+(+e.c||0),f:a.f+(+e.f||0),n:a.n+1}),{kcal:0,p:0,c:0,f:0,n:0});
}
function score(h,k){
  if(h.type==="auto"){
    if(h.src==="workout") return S.workout.cal[k]?.done?1:0;
    const t=totals(k),g=S.food.goals;
    if(h.src==="prot") return t.p>=g.p?1:t.p>=.7*g.p?.5:0;
    if(!t.n) return 0;const d=Math.abs(t.kcal-g.kcal)/g.kcal;return d<=.1?1:d<=.2?.5:0;
  }
  const v=h.log[k]||0;
  if(h.type==="count") return v>=h.target?1:v>0?.5:0;
  return v;
}
function weekCount(h,mon){let n=0;for(let i=0;i<7;i++)if(score(h,iso(addDays(mon,i))))n++;return n}
function streak(h){
  if(h.freq){let mon=mondayOf(TODAY),n=0;
    if(weekCount(h,mon)>=h.freq)n++;
    for(mon=addDays(mon,-7);weekCount(h,mon)>=h.freq&&n<200;mon=addDays(mon,-7))n++;
    return {n,u:"sem"};}
  let d=score(h,TK)?TODAY:addDays(TODAY,-1),n=0;
  while(score(h,iso(d))&&n<2000){n++;d=addDays(d,-1)}
  return {n,u:"j"};
}
function bestStreak(h){let best=0,cur=0;for(let i=180;i>=0;i--){if(score(h,iso(addDays(TODAY,-i)))){cur++;best=Math.max(best,cur)}else cur=0}return best}
function hasHistory(h){for(let i=2;i<30;i++)if(score(h,iso(addDays(TODAY,-i))))return true;return false}
const missedTwiceRisk=h=>!h.freq&&!score(h,TK)&&!score(h,iso(addDays(TODAY,-1)))&&hasHistory(h);
function rate(h,days){let n=0;for(let i=0;i<days;i++)n+=score(h,iso(addDays(TODAY,-i)))?1:0;return Math.round(n/days*100)}

async function aiGenerate(modify){

  const fmt=`Réponds UNIQUEMENT avec un objet JSON de cette forme :
{"name":"…","schedule":[0,2,4],"days":[{"name":"Jour A · Full body","ex":[{"n":"Squat","sets":4,"reps":"6-8","kg":0,"rest":"2 min","note":""}]}],"tips":["…"]}

  const prompt=modify
    ?`Tu es coach de musculation. Voici le programme actuel de l'utilisateur en JSON :\n${JSON.stringify({name:W.program.name,schedule:W.program.schedule,days:W.program.days,tips:W.program.tips})}\n\nDemande de modification : "${modify}"\nGarde tout le reste identique (y compris les charges kg déjà notées). ${fmt}`
    :`Tu es coach de musculation. Crée un programme d'entraînement hebdomadaire sûr et efficace.\nObjectif : ${GOALS[p.goal]}. Niveau : ${LEVELS[p.level]}. ${p.days} séances par semaine de ${p.minutes} minutes. Matériel : ${EQUIP[p.equip]}.\nInfos de l'utilisateur : ${p.notes||"aucune"}.\n${fmt}`;
  busy=true;sportStatus={msg:"L'IA prépare ton programme… (jusqu'à une minute)",cls:""};renderSport();
  let prog=null;
  try{
    if(!AI) throw {code:"none"};
    prog=cleanProgram(await AI.json(prompt,{modelTier:"default"}),SCHED[p.days]);
    sportStatus={msg:modify?"Programme modifié par l'IA.":"Programme créé par l'IA et planifié sur 4 semaines.",cls:"ok"};
  }catch(e){
    if(modify){busy=false;sportStatus={msg:aiErr(e)+" Le programme n'a pas changé.",cls:"bad"};renderSport();return}
    prog=localProgram(p);
    sportStatus=e?.code==="none"?{msg:"Programme créé avec le modèle intégré et planifié sur 4 semaines.",cls:"ok"}:{msg:aiErr(e)+" Programme créé avec le modèle intégré.",cls:"bad"};
  }

function icsExport(){
  const W=S.workout,pad=n=>String(n).padStart(2,"0");

  Object.entries(W.cal).filter(([k,s])=>k>=TK&&!s.done).forEach(([k,s])=>{

function fillFood(){
  const f=foodByName($("#fdName").value);if(!f)return;
  if(!$("#fdQty").dataset.touched) $("#fdQty").value=f[2]?f[2]:1;
  const qty=+$("#fdQty").value||0,mult=f[2]?qty/f[2]:qty;
  $("#fdQtyL").textContent=f[2]?"Quantité g":`Nombre (${f[1]})`;
  $("#fdK").value=r0(f[3]*mult);$("#fdP").value=+(f[4]*mult).toFixed(1);$("#fdC").value=+(f[5]*mult).toFixed(1);$("#fdF").value=+(f[6]*mult).toFixed(1);
}
function localEstimate(txt){
  const out=[];
  txt.toLowerCase().split(/,|\+|\bet\b|\bavec\b|\n/).map(s=>s.trim()).filter(Boolean).forEach(part=>{
    const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/œ/g,"oe");
    const p=norm(part);
    // l'aliment dont un mot significatif apparaît (le plus long gagne : « poulet » → Blanc de poulet)
    let f=null,best=0;
    FOOD.forEach(x=>norm(x[0].toLowerCase()).split(/[^a-z]+/).filter(w=>w.length>2&&!["blanc","une","des","nature","cuit","cuites"].includes(w)).forEach(w=>{
      const stem=w.replace(/s$/,"");if(p.includes(stem)&&stem.length>best){best=stem.length;f=x}}));
    if(!f)return;
    const g=p.match(/(\d+[.,]?\d*)\s*(g|gr|grammes|ml)\b/),n=p.match(/^(\d+[.,]?\d*)/);
    const qty=f[2]?(g?parseFloat(g[1].replace(",",".")):f[2]):(n?parseFloat(n[1].replace(",",".")):1);
    out.push(foodEntry(f,qty,ui.meal));
  });
  return out;
}
async function aiFood(){
  const txt=$("#aiFoodTxt").value.trim();ui.foodQ=txt;if(!txt)return;
  busy=true;foodStatus={msg:AI?"Estimation en cours…":"",cls:""};renderFood();
  try{
    if(!AI) throw {code:"none"};
    const res=await AI.json(`Estime les valeurs nutritionnelles de ce repas : "${txt}".
Si une quantité n'est pas donnée, prends une portion normale. Réponds UNIQUEMENT avec un tableau JSON, un objet par aliment :
[{"name":"Blanc de poulet 200 g","kcal":330,"p":62,"c":0,"f":7}]
kcal en kcal, p = protéines g, c = glucides g, f = lipides g. Noms en français avec la quantité.`,{modelTier:"quick"});
    if(!Array.isArray(res)||!res.length) throw {code:"empty"};
    ui.aiFood=res.slice(0,20).map(e=>({id:uid(),meal:ui.meal,name:String(e.name||"Aliment").slice(0,60),kcal:r0(e.kcal),p:+(+e.p||0).toFixed(1),c:+(+e.c||0).toFixed(1),f:+(+e.f||0).toFixed(1),note:"estimé par l'IA"}));
    foodStatus={msg:"Vérifie les valeurs, puis ajoute.",cls:"ok"};
  }catch(e){
    ui.aiFood=localEstimate(txt).map(x=>({...x,note:"estimation"}));
    foodStatus=ui.aiFood.length?{msg:(e?.code==="none"?"":aiErr(e)+" ")+"Estimation avec la base intégrée. Vérifie les valeurs.",cls:e?.code==="none"?"ok":"bad"}
      :{msg:(e?.code==="none"?"":aiErr(e)+" ")+"Aucun aliment reconnu dans la base intégrée. Ajoute-le à la main ci-dessus.",cls:"bad"};
  }
  busy=false;renderFood();
}

function lifeInfo(){
  const b=parse(S.settings.birth||TK),life=+S.settings.life||80;
  const end=new Date(b.getFullYear()+life,b.getMonth(),b.getDate());
  const ageY=(TODAY-b)/(365.2425*DAY),leftD=Math.max(0,Math.round((end-TODAY)/DAY));
  return {b,life,end,ageY,leftD,leftY:leftD/365.2425,leftW:Math.floor(leftD/7)};
}
const fmtN=n=>Math.round(n).toLocaleString("fr-FR");
function dayLeftTxt(){const n=new Date(),e=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1),m=Math.max(0,Math.floor((e-n)/60000));return `${Math.floor(m/60)} h ${String(m%60).padStart(2,"0")}`}

document.addEventListener("input",e=>{
  const t=e.target,d=t.dataset;

  if(t.id==="fdName"){fillFood();return}
  if(t.id==="fdQty"){t.dataset.touched=1;fillFood();return}
  if(t.id==="aiFoodTxt"){ui.foodQ=t.value;return}

  if(d.c==="hnote"){const cur=S.notes[d.id]?.[ui.sel]||{};setNote(d.id,ui.sel,{...cur,t:t.value});return}

});

  if(d.c==="pname"){P.name=t.value;save();return}
  if(d.c==="dname"){P.days[+d.d].name=t.value;P.source=P.source==="local"?"perso":P.source;save();return}
  if(d.c==="ex"){const ex=P.days[+d.d].ex[+d.i];ex[d.f]=d.f==="sets"?Math.max(1,r0(t.value)):d.f==="kg"?+t.value||0:t.value;save();return}
  if(d.c==="prof"){S.workout.profile[d.f]=t.value;save();return}
  if(d.c==="hist"){ui.hist=t.value;renderJournal();return}
  if(d.c==="birth"){if(t.value){S.settings.birth=t.value;save();render()}return}
  if(d.c==="life"){S.settings.life=Math.max(30,Math.min(120,r0(t.value)||80));save();render();return}
  if(d.c==="prof2"){S.food.profile[d.f]=t.value;save();return}
  if(d.c==="goal"){S.food.goals[d.f]=Math.max(1,r0(t.value));save();renderFood();return}
  if(d.c==="weight"){if(t.value)S.food.weight[ui.sel]=+t.value;else delete S.food.weight[ui.sel];save();return}
});
